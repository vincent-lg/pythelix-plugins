name: Validate plugins

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry

      - uses: actions/checkout@v4
        with:
          repository: vincent-lg/pythelix
          ref: ${{ vars.ENGINE_REF || 'main' }}
          path: engine

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'

      - name: Prepare the engine
        working-directory: engine
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: Validate
        run: registry/ci/validate.sh registry engine
